name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: 17
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/spring-data-valkey
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Start Valkey
        run: |
          make start PROJECT=valkey VERSION=8.1.1 GH_ORG=valkey-io

      - name: Test Spring Data Valkey
        run: |
          ./mvnw -s settings.xml \
            -Ddevelocity.storage.directory=$HOME/.develocity-root \
            -Dmaven.repo.local=$HOME/.m2/spring-data-valkey \
            test -Pnone \
            -pl spring-data-valkey \
            -DrunLongTests=true \
            -Dvalkey.server.version=8.1.1 \
            -U -B

      - name: Package Spring Data Valkey
        run: |
          ./mvnw -s settings.xml \
            -Ddevelocity.storage.directory=$HOME/.develocity-root \
            -Dmaven.repo.local=$HOME/.m2/spring-data-valkey \
            package javadoc:jar -DskipTests \
            -pl spring-data-valkey \
            -U -B

      - name: Install Spring Data Valkey
        run: |
          ./mvnw -s settings.xml \
            -Ddevelocity.storage.directory=$HOME/.develocity-root \
            -Dmaven.repo.local=$HOME/.m2/spring-data-valkey \
            install -DskipTests \
            -pl spring-data-valkey -am \
            -Dgpg.skip=true \
            -B

      - name: Test Spring Boot Starter
        run: |
          ./mvnw -s settings.xml \
            -Ddevelocity.storage.directory=$HOME/.develocity-root \
            -Dmaven.repo.local=$HOME/.m2/spring-data-valkey \
            test \
            -pl spring-boot-starter-data-valkey \
            -U -B

      - name: Package Spring Boot Starter
        run: |
          ./mvnw -s settings.xml \
            -Ddevelocity.storage.directory=$HOME/.develocity-root \
            -Dmaven.repo.local=$HOME/.m2/spring-data-valkey \
            package javadoc:jar -DskipTests \
            -pl spring-boot-starter-data-valkey \
            -U -B

      - name: Create draft release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          draft: true
          files: |
            spring-data-valkey/target/*.jar
            spring-boot-starter-data-valkey/target/*.jar
          generate_release_notes: true

  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: maven-publish
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: 17
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/spring-data-valkey
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configure GPG for non-interactive signing
        run: |
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          chmod 700 ~/.gnupg

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch release credentials
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id spring-data-valkey-maven-token \
            --query SecretString --output text)
          OSSRH_USERNAME=$(echo "$SECRET" | jq -r '.["maven-central-username"]')
          OSSRH_PASSWORD=$(echo "$SECRET" | jq -r '.["maven-central-password"]')
          GPG_PASSPHRASE=$(echo "$SECRET" | jq -r '.["gpg-passphrase"]')
          GPG_KEYNAME=$(echo "$SECRET" | jq -r '.["gpg-key-id"]')
          if [ -z "$OSSRH_USERNAME" ] || [ "$OSSRH_USERNAME" = "null" ] || [ -z "$OSSRH_PASSWORD" ] || [ "$OSSRH_PASSWORD" = "null" ]; then
            echo "ERROR: Failed to extract Maven credentials from secret"
            exit 1
          fi
          if [ -z "$GPG_PASSPHRASE" ] || [ "$GPG_PASSPHRASE" = "null" ]; then
            echo "ERROR: Failed to extract GPG passphrase from secret"
            exit 1
          fi
          if [ -z "$GPG_KEYNAME" ] || [ "$GPG_KEYNAME" = "null" ]; then
            echo "ERROR: Failed to extract GPG key ID from secret"
            exit 1
          fi
          echo "::add-mask::$OSSRH_USERNAME"
          echo "::add-mask::$OSSRH_PASSWORD"
          echo "::add-mask::$GPG_PASSPHRASE"
          echo "OSSRH_USERNAME=$OSSRH_USERNAME" >> $GITHUB_ENV
          echo "OSSRH_PASSWORD=$OSSRH_PASSWORD" >> $GITHUB_ENV
          echo "GPG_PASSPHRASE=$GPG_PASSPHRASE" >> $GITHUB_ENV
          echo "GPG_KEYNAME=$GPG_KEYNAME" >> $GITHUB_ENV

      - name: Import GPG private key
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id spring-data-valkey-maven-token \
            --query SecretString --output text)
          GPG_KEY=$(echo "$SECRET" | jq -r '.["gpg-private-key"]')
          if [ -z "$GPG_KEY" ] || [ "$GPG_KEY" = "null" ]; then
            echo "ERROR: Failed to extract GPG private key from secret"
            exit 1
          fi
          echo "::add-mask::$GPG_KEY"
          echo "$GPG_KEY" | tr ' ' '\n' | base64 -d | gpg --batch --import
          if ! gpg --list-secret-keys --keyid-format short 2>/dev/null | grep -q 'sec'; then
            echo "ERROR: GPG key import failed"
            exit 1
          fi

      - name: Deploy to Maven Central staging
        id: deploy
        run: |
          # Uploads + closes the staging repo, registering a VALIDATED deployment on the
          # Portal. autoReleaseAfterClose is intentionally omitted: it is a no-op on the
          # Portal compatibility API; the release is performed explicitly below.
          ./mvnw -s settings.xml \
            -Ddevelocity.storage.directory=$HOME/.develocity-root \
            -Dmaven.repo.local=$HOME/.m2/spring-data-valkey \
            deploy -DskipTests \
            -pl spring-data-valkey,spring-boot-starter-data-valkey \
            -Dmaven.deploy.skip=false \
            -U -B

      - name: Release deployment to Maven Central
        id: release
        run: |
          set -euo pipefail
          PORTAL="https://central.sonatype.com/api/v1/publisher"
          STAGING="https://ossrh-staging-api.central.sonatype.com/manual/search/repositories"

          state_of() {
            curl -s -X POST -u "$OSSRH_USERNAME:$OSSRH_PASSWORD" "${PORTAL}/status?id=$1" | jq -r '.deploymentState'
          }

          # Find the Portal deployment id created by the maven deploy above.
          REPOS="$(curl -s -u "$OSSRH_USERNAME:$OSSRH_PASSWORD" "${STAGING}?profile_id=io.valkey&state=closed")"
          echo "$REPOS" | jq '.repositories | map({key, description, state, portal_deployment_id})'
          if [ "$(echo "$REPOS" | jq '.repositories | length')" != "1" ]; then
            echo "ERROR: expected exactly 1 closed staging repo."
            exit 1
          fi
          DEPLOYMENT_ID="$(echo "$REPOS" | jq -r '.repositories[0].portal_deployment_id')"
          echo "Deployment: $DEPLOYMENT_ID"

          # Wait for validation to finish before publishing.
          for i in $(seq 1 30); do
            STATE="$(state_of "$DEPLOYMENT_ID")"; echo "  validate [$i] $STATE"
            case "$STATE" in
              VALIDATED) break ;;
              FAILED) echo "ERROR: validation FAILED."; exit 1 ;;
            esac
            [ "$i" = 30 ] && { echo "ERROR: timed out waiting for VALIDATED."; exit 1; }
            sleep 10
          done

          # Publish (irreversible).
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -X POST -u "$OSSRH_USERNAME:$OSSRH_PASSWORD" "${PORTAL}/deployment/${DEPLOYMENT_ID}")"
          echo "Publish HTTP $CODE"
          [ "$CODE" = "204" ] || [ "$CODE" = "200" ] || { echo "ERROR: publish returned $CODE"; exit 1; }

          # Confirm it reaches PUBLISHED.
          for i in $(seq 1 30); do
            STATE="$(state_of "$DEPLOYMENT_ID")"; echo "  publish [$i] $STATE"
            case "$STATE" in
              PUBLISHED) echo "Released to Maven Central."; exit 0 ;;
              FAILED) echo "ERROR: publish FAILED."; exit 1 ;;
            esac
            sleep 20
          done
          echo "ERROR: timed out waiting for PUBLISHED (last: $STATE)."
          exit 1

      - name: Drop staging repository on failure
        if: failure() && (steps.deploy.outcome == 'failure' || steps.release.outcome == 'failure')
        run: |
          # Clean up the staging repo so a retry starts fresh.
          AUTH_HEADER="Bearer $(echo -n "${OSSRH_USERNAME}:${OSSRH_PASSWORD}" | base64 | tr -d '\n')"
          REPOS=$(curl -s --header "Authorization: ${AUTH_HEADER}" \
            "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?profile_id=io.valkey")
          REPO_COUNT=$(echo "$REPOS" | jq '.repositories | length')
          if [ "$REPO_COUNT" = "1" ]; then
            REPO_KEY=$(echo "$REPOS" | jq -r '.repositories[0].key')
            echo "Dropping repository: $REPO_KEY"
            curl --fail --request DELETE --header "Authorization: ${AUTH_HEADER}" \
              "https://ossrh-staging-api.central.sonatype.com/manual/drop/repository/${REPO_KEY}"
          elif [ "$REPO_COUNT" = "0" ]; then
            echo "No staging repository found - nothing to clean up"
          else
            echo "Multiple staging repositories found ($REPO_COUNT) - manual cleanup required"
            echo "$REPOS" | jq '.repositories'
          fi
